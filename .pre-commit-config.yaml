# Copied from 3rdparty/sglang/.pre-commit-config.yaml and adapted to the
# sglang-supa repository layout. Keep hook revisions aligned during upgrades.
default_stages: [pre-commit, pre-push, manual]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-ast
      - id: check-added-large-files
        args: ['--maxkb=1500']
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: debug-statements
      - id: no-commit-to-branch
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
        args: [--settings-path, .isort.cfg]
        exclude: '^sglang_supa/srt/grpc/.*_pb2\.py$|^sglang_supa/srt/grpc/.*_pb2_grpc\.py$|^sglang_supa/srt/grpc/.*_pb2\.pyi$|^sglang_supa/srt/grpc/.*_pb2_grpc\.pyi$'
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args:
          - --select=F401,F821,UP037
          - --fix
        files: ^(docs/|examples/|scripts/|sglang_supa/|test/|tools/)
        exclude: |
          (?x)^(
          .*/__init__\.py$|
          .*\.ipynb$|
          sglang_supa/srt/grpc/.*_pb2\.py$|
          sglang_supa/srt/grpc/.*_pb2_grpc\.py$|
          sglang_supa/srt/grpc/.*_pb2\.pyi$|
          sglang_supa/srt/grpc/.*_pb2_grpc\.pyi$|
          )$
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black-jupyter
        exclude: '^sglang_supa/srt/grpc/.*_pb2\.py$|^sglang_supa/srt/grpc/.*_pb2_grpc\.py$|^sglang_supa/srt/grpc/.*_pb2\.pyi$|^sglang_supa/srt/grpc/.*_pb2_grpc\.pyi$'
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: ['--config', '.codespellrc']
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.7
    hooks:
    - id: clang-format
      types_or: [c++, cuda]
      args: [--style=file, --verbose]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.0
    hooks:
      - id: nbstripout
        args:
          - '--keep-output'
          - '--extra-keys=metadata.kernelspec metadata.language_info.version'
  - repo: local
    hooks:
      - id: check-chinese-characters
        name: check chinese characters in multimodal_gen
        entry: >-
          python3 -c 'import sys, re; p=re.compile(r"[\u4e00-\u9fff]"); ec=0; [ ([(print(f"{f}:{i+1}: {l.strip()}") or (ec:=1)) for i,l in enumerate(open(f, "r", encoding="utf-8", errors="ignore")) if p.search(l)]) for f in sys.argv[1:] ]; sys.exit(ec)'
        language: system
        files: ^sglang_supa/multimodal_gen/.*
        exclude: ^(sglang_supa/multimodal_gen/configs/sample|sglang_supa/multimodal_gen/apps/ComfyUI_SGLDiffusion/workflows|sglang_supa/multimodal_gen/runtime/pipelines_core/stages/model_specific_stages)(/|$)
        types_or: [python, markdown, json, text]
      - id: check-no-bare-pytest-main
        name: reject bare pytest.main calls in __main__ blocks
        entry: python3 scripts/lint/check_no_bare_pytest_main.py
        language: system
        files: ^(examples|sglang_supa|test)/.*\.py$
